name: 问题报告
description: 报告安装、启动、设备连接、路线或回放问题
body:
  - type: markdown
    attributes:
      value: |
        Issue 是公开的。请遮盖设备名称、完整 UDID、序列号和个人位置。无需上传配对文件、个人轨迹或本机配置。
  - type: input
    id: app-version
    attributes:
      label: iOSRealRun 版本
      description: 填写 Release 版本或源码提交号，并注明是发布包、Actions 构建还是源码。
      placeholder: 例如 v1.0.0，Windows 便携包
    validations:
      required: true
  - type: input
    id: desktop-system
    attributes:
      label: 电脑系统与架构
      placeholder: 例如 Windows 11 24H2 x64、macOS 15.7 arm64、Ubuntu 24.04 x86_64
    validations:
      required: true
  - type: input
    id: mobile-device
    attributes:
      label: 设备型号与完整系统版本
      description: 只填写型号和 iOS / iPadOS 版本。未连接设备时可留空。
      placeholder: 例如 iPad Air（第 5 代），iPadOS 26.4.1
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤和实际结果
      description: 说明问题出现在哪一步、当时发生了什么，以及原本预期的结果。
      placeholder: |
        1. 打开程序并……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误提示或截图
      description: 可粘贴相关错误文字或附上截图。请先遮盖个人信息与设备标识。
