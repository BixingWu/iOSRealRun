name: Build portable apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            asset: Windows-x64
            file: iOSRealRun-Windows-x64.zip
          - os: macos-15
            architecture: arm64
            asset: macOS-arm64
            file: iOSRealRun-macOS-arm64.zip
          - os: ubuntu-22.04
            architecture: x64
            asset: Linux-x64
            file: iOSRealRun-Linux-x64.tar.gz
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libfontconfig1 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Check the desktop app without a device
        run: python desktop.py --self-test
      - name: Build and test portable package
        run: python build_portable.py
      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: iOSRealRun-${{ matrix.asset }}
          path: dist/*/${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: iOSRealRun-*
          path: release-assets
          merge-multiple: true
      - name: Generate asset checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum iOSRealRun-Windows-x64.zip iOSRealRun-macOS-arm64.zip iOSRealRun-Linux-x64.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          expected_tag="v$(python -c 'from app_version import VERSION; print(VERSION)')"
          [[ "$RELEASE_TAG" == "$expected_tag" ]]
          remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$remote_tag_sha" == "$(git rev-parse "$RELEASE_SHA^{commit}")" ]]
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --target "$remote_tag_sha" \
            --title "iOSRealRun $RELEASE_TAG" --notes-file "$notes" "${prerelease[@]}" -- "$RELEASE_TAG" \
            release-assets/iOSRealRun-Windows-x64.zip release-assets/iOSRealRun-macOS-arm64.zip \
            release-assets/iOSRealRun-Linux-x64.tar.gz release-assets/SHA256SUMS.txt
